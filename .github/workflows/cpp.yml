name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Configure CMake
        run: |
          cmake -B build -DBUILD_TESTING=ON -DCMAKE_CUDA_ARCHITECTURES=75 -DSKIP_CUDA_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Run GTests
        run: cd build && ctest --output-on-failure

  cuda-compile:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.2.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential wget
      - name: Install modern CMake
        run: |
          CMAKE_VERSION=3.28.3
          wget -q https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz
          tar -xzf cmake-$CMAKE_VERSION-linux-x86_64.tar.gz -C /usr/local --strip-components=1
      - name: Configure CMake
        run: |
          cmake -B build -DBUILD_TESTING=ON -DCMAKE_CUDA_ARCHITECTURES=75 -DSKIP_CUDA_TESTS=OFF
      - name: Build
        run: cmake --build build
