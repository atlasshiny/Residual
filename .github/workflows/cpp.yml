name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cpp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Configure CMake
        run: |
          cmake -B build -DBUILD_TESTING=ON -DCMAKE_CUDA_ARCHITECTURES=75 -DSKIP_CUDA_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Run GTests
        run: cd build && ctest --output-on-failure