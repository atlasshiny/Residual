[package]
name = "residual-ui"
version = "0.1.0"
description = "Residual orbit viewport and result viewer"
edition = "2021"

[lib]
name = "residual_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
