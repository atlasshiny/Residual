[project]
name = "residual"
version = "0.1.0"
description = "Orbital propagator, residual analysis, KAN symbolic correction, and Cosmos validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.uv]
package = true