[project]
name = "residual"
version = "0.1.0"
description = "Orbital propagator, residual analysis, PINN/SINDy residual correction, and Cosmos validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.38.1",
    "numpy>=1.26",
    "scikit-learn",
]

[project.optional-dependencies]
gpu = ["torch"]
data = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15.0"]
spice = ["spiceypy>=6.0"]
render = ["numpy>=1.26", "requests>=2.32.3"]
dev = ["pytest>=8.0", "ruff>=0.6"]
config = ["pydantic>=2.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml"]

[tool.uv]
package = true
