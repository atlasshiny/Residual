[package]
name = "posebuilder"
version = "0.1.0"
edition = "2021"

[dependencies]
dynamics = { path = "../dynamics" }
frames = { path = "../frames" }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
ingest = { path = "../ingest" }
serde_json = "1"

[features]
default = []
serde = ["dep:serde"]

[lib]
name = "posebuilder"
path = "src/lib.rs"
