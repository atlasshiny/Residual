[package]
name = "evaluator"
version = "0.1.0"
edition = "2021"

[dependencies]
dynamics = { path = "../dynamics" }
posebuilder = { path = "../posebuilder" }
frames = { path = "../frames" }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

[lib]
name = "evaluator"
path = "src/lib.rs"
